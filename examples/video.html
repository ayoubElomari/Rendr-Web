<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>rendr-web: video example</title>
  <link rel="stylesheet" href="shared/demo.css" />
</head>
<body>
  <main id="app"></main>

  <script type="module">
    import { mountPlayground } from "./shared/demo.js";

    // Real footage decoded live through WebCodecs, with type animating over it.
    // The clip is 30 fps with a keyframe every 4 frames on purpose (see README):
    // a group of pictures that fits the decoder's live-frame window is decoded once.
    const composition = {
      rendr: "v2.1.0",
      settings: { fps: 30, resolution: [1280, 720] },
      variables: {
        accent: "#e6e6e6",
        title: "Decoded, not preprocessed",
        subtitle: "This footage was never baked into a file. It decodes live, right here.",
        titleSize: "84px",
      },
      assets: { media: { backdrop: { type: "video", src: "./assets/backdrop.mp4" } } },
      timeline: [
        {
          id: "clip", type: "Video",
          at: "00:00:00.000", duration: "00:00:06.000",
          config: { src: "@assets:backdrop" },
          style: { "&": { position: "absolute", inset: "0", width: "1280px", height: "720px", zIndex: 1 } },
        },
        {
          id: "shade", type: "Text",
          at: "00:00:00.000", duration: "00:00:06.000",
          config: { content: "" },
          style: { "&": {
            position: "absolute", inset: "0", zIndex: 2,
            background: "linear-gradient(90deg, rgba(0,0,0,0.82) 0%, rgba(0,0,0,0.15) 70%)",
          } },
        },
        {
          id: "rule", type: "Text",
          at: "00:00:00.300", duration: "00:00:05.400",
          config: { content: "" },
          style: { "&": {
            position: "absolute", top: "250px", left: "90px", height: "6px", zIndex: 3,
            background: "@variables:accent",
            width: { keyframes: [
              { at: "0%", value: "0px", easing: "easeOutCubic" },
              { at: "18%", value: "180px" },
              { at: "100%", value: "180px" },
            ] },
          } },
        },
        {
          id: "title", type: "Text",
          at: "00:00:00.500", duration: "00:00:05.000",
          config: { content: "@variables:title" },
          style: { "&": {
            position: "absolute", top: "290px", left: "90px", width: "900px", zIndex: 3,
            color: "#ffffff", fontFamily: "system-ui, Segoe UI, sans-serif", fontWeight: "700",
            fontSize: "@variables:titleSize", lineHeight: 1.05, letterSpacing: "-0.02em",
            opacity: { keyframes: [
              { at: "0%", value: 0, easing: "easeOutQuad" },
              { at: "14%", value: 1 }, { at: "86%", value: 1 },
              { at: "100%", value: 0, easing: "easeInQuad" },
            ] },
            transform: { keyframes: [
              { at: "0%", value: "translateY(18px)", easing: "easeOutCubic" },
              { at: "20%", value: "translateY(0px)" },
              { at: "100%", value: "translateY(0px)" },
            ] },
          } },
        },
        {
          id: "subtitle", type: "Text",
          at: "00:00:01.100", duration: "00:00:04.400",
          config: { content: "@variables:subtitle" },
          style: { "&": {
            position: "absolute", top: "520px", left: "90px", width: "720px", zIndex: 3,
            color: "rgba(255,255,255,0.82)", fontFamily: "system-ui, Segoe UI, sans-serif",
            fontSize: "30px", lineHeight: 1.35,
            opacity: { keyframes: [
              { at: "0%", value: 0, easing: "easeOutQuad" },
              { at: "16%", value: 1 }, { at: "84%", value: 1 },
              { at: "100%", value: 0, easing: "easeInQuad" },
            ] },
          } },
        },
      ],
    };

    mountPlayground(document.getElementById("app"), {
      page: "video",
      eyebrow: "rendr-web · example 2",
      title: "Live video decode",
      lede: "The footage is decoded in this tab through WebCodecs, one group of pictures at a time. It is never pre-rendered or baked into the file. Edit the title and the picture follows.",
      composition,
      filename: "video.rendr.json",
      fields: [
        { id: "title", label: "Title", type: "text", path: ["variables", "title"] },
        { id: "subtitle", label: "Subtitle", type: "text", path: ["variables", "subtitle"] },
        { id: "size", label: "Title size", type: "range", min: 40, max: 120, step: 2, unit: "px", path: ["variables", "titleSize"] },
        { id: "accent", label: "Accent", type: "color", path: ["variables", "accent"] },
      ],
      note: "Needs a current Chrome, Edge, or Safari (WebCodecs) and an http server, not <code>file://</code>. Watch <strong>Cached frames</strong> and <strong>Memory</strong> in the strip above: the cache fills as you play, up to a fixed memory budget, and never past it.",
    });
  </script>
</body>
</html>
